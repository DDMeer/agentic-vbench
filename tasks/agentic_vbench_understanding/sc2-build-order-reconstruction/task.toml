version = "1.0"

[task]
name = "agentic-vbench/sc2-build-order-reconstruction"

[metadata]
difficulty = "hard"
category = "video-understanding"
tags = ["video-understanding", "rts", "starcraft-2", "build-order", "event-timeline", "agentic-vbench-understanding"]
# Ordinary ladder 1v1 TvZ (AutomatonLE, base build 75689, ~15 min), no HUD/panels/counters.
# GT machine-parsed from the same .SC2Replay the video was rendered from (UnitInitEvent = construction start).
source = "AutomatonLE 1v1 TvZ ladder replay (gt/match.SC2Replay), base build 75689"

[environment]
build_timeout_sec = 2400.0
cpus = 4
memory_mb = 8192
# 9 tiles ~135 MB total; give the build and trial room.
storage_mb = 16384
# The tiles are baked at build time and the GT is not online: keep this false.
allow_internet = false

[environment.env]
HF_TOKEN = "${HF_TOKEN:-}"

[[steps]]
name = "solve"

[steps.agent]
# A 15-min tiled bird's-eye with ~94 structures needs real time to seek and tally.
timeout_sec = 3600.0

[steps.verifier]
timeout_sec = 600.0
